<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check Amount">

  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="icon" href="https://fav.farm/💵" type="image/x-icon">

  <title>Check Amount</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 30px;
      padding: 16px;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      background: white;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .result-box {
      margin-top: 25px;
      padding: 18px 22px;
      background: white;
      border-radius: 14px;
      height: 110px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    .result {
      width: 100%;
      font-size: 21px;
      line-height: 1.3;
      font-weight: 600;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Botões lado a lado */
    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      min-width: 0;
      border: none;
      border-radius: 14px;
      padding: 17px 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0;
    }

    .copy {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 600;
      min-height: 22px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Check Amount</h1>

  <label for="amount">Enter amount</label>

  <input
    id="amount"
    type="number"
    inputmode="decimal"
    step="0.01"
    placeholder="408.75"
    oninput="convertAmount()"
  >

  <div class="result-box">
    <div id="result" class="result">
      Enter an amount above
    </div>
  </div>

  <div class="buttons">
    <button class="copy" onclick="copyResult()">
      COPY
    </button>

    <button class="clear" onclick="clearAmount()">
      CLEAR
    </button>
  </div>

  <div id="message" class="message"></div>

</div>

<script>
const ones = [
  "", "one", "two", "three", "four", "five",
  "six", "seven", "eight", "nine", "ten",
  "eleven", "twelve", "thirteen", "fourteen",
  "fifteen", "sixteen", "seventeen", "eighteen",
  "nineteen"
];

const tens = [
  "", "", "twenty", "thirty", "forty",
  "fifty", "sixty", "seventy", "eighty", "ninety"
];

function numberToWords(num) {
  if (num === 0) return "zero";

  if (num < 20) {
    return ones[num];
  }

  if (num < 100) {
    return tens[Math.floor(num / 10)] +
      (num % 10 !== 0 ? "-" + ones[num % 10] : "");
  }

  if (num < 1000) {
    return ones[Math.floor(num / 100)] +
      " hundred" +
      (num % 100 !== 0 ? " " + numberToWords(num % 100) : "");
  }

  if (num < 1000000) {
    return numberToWords(Math.floor(num / 1000)) +
      " thousand" +
      (num % 1000 !== 0 ? " " + numberToWords(num % 1000) : "");
  }

  if (num < 1000000000) {
    return numberToWords(Math.floor(num / 1000000)) +
      " million" +
      (num % 1000000 !== 0 ? " " + numberToWords(num % 1000000) : "");
  }

  return "Amount too large";
}

function capitalize(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function convertAmount() {
  const input = document.getElementById("amount");
  const result = document.getElementById("result");
  const message = document.getElementById("message");

  message.innerText = "";

  if (input.value.trim() === "") {
    result.innerText = "Enter an amount above";
    return;
  }

  let value = Number(input.value);

  if (!Number.isFinite(value) || value < 0) {
    result.innerText = "Invalid amount";
    return;
  }

  value = Math.round((value + Number.EPSILON) * 100) / 100;

  const dollars = Math.floor(value);
  const cents = Math.round((value - dollars) * 100);

  if (dollars >= 1000000000) {
    result.innerText = "Amount too large";
    return;
  }

  let text;

  if (dollars === 0) {
    text = "Zero dollars";
  } else {
    text = capitalize(numberToWords(dollars)) +
      (dollars === 1 ? " dollar" : " dollars");
  }

  text += " " + String(cents).padStart(2, "0") + "/100";

  result.innerText = text;
}

async function copyResult() {
  const result = document.getElementById("result").innerText;
  const message = document.getElementById("message");

  if (
    result === "Enter an amount above" ||
    result === "Invalid amount" ||
    result === "Amount too large"
  ) {
    return;
  }

  try {
    await navigator.clipboard.writeText(result);
    message.innerText = "Copied!";
  } catch (error) {
    const textArea = document.createElement("textarea");
    textArea.value = result;
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";

    document.body.appendChild(textArea);
    textArea.select();

    const copied = document.execCommand("copy");
    textArea.remove();

    message.innerText = copied
      ? "Copied!"
      : "Unable to copy. Please try again.";
  }

  setTimeout(() => {
    message.innerText = "";
  }, 2000);
}

function clearAmount() {
  document.getElementById("amount").value = "";

  document.getElementById("result").innerText =
    "Enter an amount above";

  document.getElementById("message").innerText = "";

  document.getElementById("amount").focus();
}
</script>

</body>
</html>
