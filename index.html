<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Check Amount">

  <title>Check Amount</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f4f7;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 30px;
      padding: 16px;
      border: 2px solid #d1d5db;
      border-radius: 14px;
      background: white;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .result-box {
      margin-top: 25px;
      padding: 22px;
      background: white;
      border-radius: 14px;
      min-height: 130px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .result {
      font-size: 21px;
      line-height: 1.5;
      font-weight: 600;
      word-wrap: break-word;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 17px;
      font-size: 18px;
      font-weight: 700;
      margin-top: 15px;
      cursor: pointer;
    }

    .copy {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #16a34a;
      font-weight: 600;
      min-height: 22px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Check Amount</h1>

  <label for="amount">Enter amount</label>

  <input
    id="amount"
    type="number"
    inputmode="decimal"
    step="0.01"
    placeholder="408.75"
    oninput="convertAmount()"
  >

  <div class="result-box">
    <div id="result" class="result">
      Enter an amount above
    </div>
  </div>

  <button class="copy" onclick="copyResult()">
    COPY
  </button>

  <button class="clear" onclick="clearAmount()">
    CLEAR
  </button>

  <div id="message" class="message"></div>

</div>

<script>

const ones = [
  "", "one", "two", "three", "four", "five",
  "six", "seven", "eight", "nine", "ten",
  "eleven", "twelve", "thirteen", "fourteen",
  "fifteen", "sixteen", "seventeen", "eighteen",
  "nineteen"
];

const tens = [
  "", "", "twenty", "thirty", "forty",
  "fifty", "sixty", "seventy", "eighty", "ninety"
];

function numberToWords(num) {

  if (num === 0) return "zero";

  if (num < 20) {
    return ones[num];
  }

  if (num < 100) {
    return tens[Math.floor(num / 10)] +
      (num % 10 !== 0 ? "-" + ones[num % 10] : "");
  }

  if (num < 1000) {
    return ones[Math.floor(num / 100)] +
      " hundred" +
      (num % 100 !== 0 ? " " + numberToWords(num % 100) : "");
  }

  if (num < 1000000) {
    return numberToWords(Math.floor(num / 1000)) +
      " thousand" +
      (num % 1000 !== 0 ? " " + numberToWords(num % 1000) : "");
  }

  if (num < 1000000000) {
    return numberToWords(Math.floor(num / 1000000)) +
      " million" +
      (num % 1000000 !== 0 ? " " + numberToWords(num % 1000000) : "");
  }

  return "Amount too large";
}

function convertAmount() {

  const input = document.getElementById("amount");
  const result = document.getElementById("result");

  let value = parseFloat(input.value);

  if (isNaN(value)) {
    result.innerText = "Enter an amount above";
    return;
  }

  if (value < 0) {
    result.innerText = "Invalid amount";
    return;
  }

  value = Math.round(value * 100) / 100;

  const dollars = Math.floor(value);
  const cents = Math.round((value - dollars) * 100);

  let text = "";

  if (dollars === 0) {
    text = "Zero dollars";
  } else {
    text = capitalize(numberToWords(dollars)) +
      (dollars === 1 ? " dollar" : " dollars");
  }

  // Centavos sem "and"
  text += " " + String(cents).padStart(2, "0") + "/100";

  result.innerText = text;
}

function capitalize(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function copyResult() {

  const result = document.getElementById("result").innerText;

  if (
    result === "Enter an amount above" ||
    result === "Invalid amount"
  ) {
    return;
  }

  navigator.clipboard.writeText(result);

  document.getElementById("message").innerText = "Copied!";

  setTimeout(() => {
    document.getElementById("message").innerText = "";
  }, 1500);
}

function clearAmount() {

  document.getElementById("amount").value = "";

  document.getElementById("result").innerText =
    "Enter an amount above";

  document.getElementById("message").innerText = "";

  document.getElementById("amount").focus();
}

</script>

</body>
</html>
